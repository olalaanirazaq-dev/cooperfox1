<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin login | Cooper Fox Realty</title>
    <link rel="icon" type="image/png" href="cooper%20fox%20icon.png" />
    <link rel="shortcut icon" type="image/png" href="cooper%20fox%20icon.png" />
    <link rel="apple-touch-icon" href="cooper%20fox%20icon.png" />
    <link rel="stylesheet" href="cooper-fox-stylesheet.css" />
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        font-family: Arial, sans-serif;
        background: linear-gradient(135deg, #101d1b 0%, #1e2f2d 100%);
        color: #f4efe7;
      }
      .page-shell {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 32px 16px;
      }
      .admin-card {
        width: min(100%, 460px);
        background: rgba(255,255,255,0.06);
        border: 1px solid rgba(255,255,255,0.12);
        border-radius: 18px;
        padding: 28px 22px;
        box-shadow: 0 24px 52px rgba(0,0,0,0.16);
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 18px;
        font-weight: 700;
      }
      .brand-mark {
        display: grid;
        place-items: center;
        width: 36px;
        height: 36px;
        border-radius: 12px;
        background: linear-gradient(135deg, #d8bd84, #f0e3c2);
        color: #101d1b;
        font-size: 0.8rem;
      }
      h1 {
        margin: 0 0 6px;
        font-size: clamp(1.8rem, 4vw, 2.5rem);
      }
      p {
        line-height: 1.6;
        color: rgba(255,255,255,0.8);
      }
      label {
        display: block;
        margin: 18px 0 8px;
        font-size: 0.75rem;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: rgba(255,255,255,0.7);
      }
      input {
        width: 100%;
        box-sizing: border-box;
        height: 48px;
        padding: 0 14px;
        border-radius: 10px;
        border: 1px solid rgba(255,255,255,0.14);
        background: rgba(255,255,255,0.02);
        color: white;
      }
      input::placeholder { color: rgba(255,255,255,0.45); }
      button {
        width: 100%;
        height: 50px;
        border: 0;
        border-radius: 999px;
        background: linear-gradient(135deg, #d8bd84, #f0e3c2);
        color: #111b19;
        font-weight: 800;
        cursor: pointer;
        margin-top: 18px;
      }
      .message {
        min-height: 20px;
        margin-top: 14px;
        color: #f9d7a6;
        font-weight: 600;
      }
      .meta {
        margin-top: 18px;
        font-size: 0.85rem;
      }
      .meta a {
        color: #f0e3c2;
        text-decoration: none;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <main class="page-shell">
      <section class="admin-card">
        <div class="brand">
          <span class="brand-mark">CF</span>
          <span>Cooper Fox Realty</span>
        </div>
        <h1>Admin login</h1>
        <p>Use the admin workspace to manage listings, tours, and property updates.</p>

        <form action="mail.php" method="post">
          <input type="hidden" name="Action" value="admin_sign_in" />
          <label for="adminEmail">Email</label>
          <input id="adminEmail" name="Email" type="email" placeholder="admin@yourdomain.com" required />

          <label for="adminPassword">Password</label>
          <input id="adminPassword" name="Password" type="password" placeholder="Enter your admin password" required />

          <button type="submit">Open admin workspace</button>
        </form>

        <div id="adminMessage" class="message" aria-live="polite"></div>

        <div class="meta">
          <a href="SignUp.html#signin">User login</a>
          ·
          <a href="index.html">Back to home</a>
        </div>
      </section>
    </main>
  </body>
</html>
